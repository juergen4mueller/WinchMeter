<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Plotly CSV Viewer</title>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<style>
    body { font-family: Arial; margin: 20px; }
    #plot { width: 100%; height: 80vh; }
</style>
</head>
<body>

<h2>VESC → Plotly Visualisierung</h2>

<input type="file" id="csvFile" accept=".csv">
<div id="plot"></div>

<script>
// CSV Parser
function parseCSV(text) {
    const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
    const header = lines[0].split(";");

    const rows = lines.slice(1).map(line => {
        const values = line.split(";");
        const obj = {};
        header.forEach((h, i) => obj[h] = parseFloat(values[i]) || values[i]);
        return obj;
    });

    return rows;
}

document.getElementById("csvFile").addEventListener("change", function () {
    const file = this.files[0];
    const reader = new FileReader();

    reader.onload = function (e) {
        const csvText = e.target.result;
        const df = parseCSV(csvText);

        // Spalten berechnen wie in deinem Python-Code
        df.forEach(row => {
            row.speed_kmhX10 = row.speed_meters_per_sec * 3.6;
            row.duty_high = row.duty_cycle * 100;
            row.fault_high = row.fault_code * 100;
            row.tacho_scale = row.tacho_meters / 10;
            row.pwm_value = row.watt_hours_charged * 100;
            row.current_soll = row.watt_hours_used;
        });

        // Plotly-Daten vorbereiten
        const columns = [
            "current_motor", "input_voltage", "current_in", "duty_high",
            "speed_kmhX10", "fault_high", "temp_mos_max", "tacho_scale", "temp_motor"
        ];

        const traces = columns.map(col => ({
            x: df.map((_, i) => i),
            y: df.map(r => r[col]),
            mode: "lines",
            name: col
        }));

        Plotly.newPlot("plot", traces, {
            title: "Fahrdaten Analyse",
            xaxis: { title: "Index" },
            yaxis: { title: "Wert" }
        });
    };

    reader.readAsText(file);
});
</script>

</body>
</html>
